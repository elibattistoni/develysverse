name: ClickUp - Event Signal

on:
  create:
  pull_request:
    branches: [main]
    types: [opened, ready_for_review, converted_to_draft, closed, reopened]

permissions: {}

jobs:
  signal:
    if: >-
      github.repository_id == '768432078' &&
      github.actor_id == '14360502' &&
      ((github.event_name == 'create' && github.event.ref_type == 'branch') ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.id == 768432078))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Signal only (no secrets, checkout, artifacts or cache)
        run: echo 'Event received.'

name: Security

on:
  pull_request:

# Read-only: the scanners only read the code and report.
permissions:
  contents: read

# A new push to the same PR cancels the run that is still going.
concurrency:
  group: security-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Each job looks only at what the PR changes, so findings that already exist
# on main never block a PR (a built-in "baseline").
jobs:
  secrets:
    name: Secrets (TruffleHog)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Scans the PR's commits. Verification checks whether a found key still works.
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@d232362a64a09a9e7d58267b8f5acef00ae90e23 # v3.100.0
        with:
          version: 3.100.0@sha256:8fd07ea46a3f59583c4d50f006d8cf150530141b28969c3c34cc455cb9165a6b
          extra_args: --results=verified,unknown

  code:
    name: Code patterns (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: semgrep/semgrep:1.186.0@sha256:6e1b04340e60e910fbb4ddbf3c857ab0918f064417ad5ac530014ccb3cf8c8f1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # --baseline-commit reports only findings that the PR adds.
      - name: Semgrep
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          semgrep scan --error --metrics=off --baseline-commit "$BASE_SHA" \
            --config p/javascript --config p/typescript --config p/react \
            --config p/github-actions --config p/secrets \
            --config .semgrep/develysverse.yml

  dependencies:
    name: Dependencies (dependency review)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Fails if the PR adds a package with a known high or critical vulnerability,
      # including dev dependencies (they run in CI and on your machine).
      - name: Dependency review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development

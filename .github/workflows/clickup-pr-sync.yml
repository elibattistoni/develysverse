name: ClickUp - Trusted Sync

# Privileged: runs from main only (clickup-sync environment). It never checks out or
# runs code from the event; it only reads GitHub's API.
# Two jobs:
#   check - validates the trigger and the event against the exact pilot. No ClickUp
#           token. Only runs that pass go on, so a run that would skip never enters
#           the write queue.
#   sync  - one queue for every write to the pilot task. Recomputes the target from
#           the current GitHub state right before writing, so a run replaced while
#           pending loses nothing.
# Statuses only move forward (TODO -> IN PROGRESS -> CODE REVIEW -> MERGED). A missed or
# late event catches up when a later eligible run (or an owner dispatch) passes. Manual
# statuses it reads are never changed.

on:
  workflow_run:
    workflows: [ClickUp - Event Signal]
    types: [completed]
  # Manual reconcile. Recover with a new dispatch: re-runs are rejected.
  workflow_dispatch:

permissions: {}

jobs:
  check:
    if: >-
      github.repository_id == '768432078' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == '1' &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.workflow_id == 431464832 &&
        github.event.workflow_run.head_repository.id == 768432078 &&
        github.event.workflow_run.actor.id == 14360502 &&
        github.event.workflow_run.triggering_actor.id == 14360502 &&
        github.event.workflow_run.run_attempt == 1) ||
       (github.event_name == 'workflow_dispatch' &&
        github.actor_id == '14360502'))
    # The environment is used only for the pilot task variable; the token is not read here.
    environment: clickup-sync
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      eligible: ${{ steps.check.outputs.eligible }}
    steps:
      - name: Validate trigger and event against the pilot
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          CLICKUP_PILOT_TASK_ID: ${{ vars.CLICKUP_PILOT_TASK_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          REPO = 'elibattistoni/develysverse'
          REPO_ID = 768432078
          OWNER_ID = 14360502
          WORKFLOW_ID = 431464832

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect())

          def github(path):
              req = urllib.request.Request(
                  'https://api.github.com/repos/' + REPO + path,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/json'})
              with opener.open(req, timeout=15) as response:
                  return json.load(response)

          def skip(reason):
              print('Not eligible: ' + reason)
              sys.exit(0)

          def require(condition, reason):
              if not condition:
                  raise RuntimeError(reason)

          def valid_number(value):
              return type(value) is int and value > 0

          def event_pr(payload, branch):
              """PR number the event is about (None if not a PR event); skip unrelated events."""
              if os.environ.get('GITHUB_EVENT_NAME') == 'workflow_dispatch':
                  require(payload['sender']['id'] == OWNER_ID, 'Unexpected dispatch actor')
                  return None
              require(os.environ.get('GITHUB_EVENT_NAME') == 'workflow_run', 'Unexpected trigger')
              run = payload['workflow_run']
              require(run['workflow_id'] == WORKFLOW_ID and
                      run['path'] == '.github/workflows/clickup-branch-sync.yml' and
                      run['conclusion'] == 'success' and run['run_attempt'] == 1 and
                      run['head_repository']['id'] == REPO_ID and
                      run['actor']['id'] == OWNER_ID and
                      run['triggering_actor']['id'] == OWNER_ID, 'Unexpected upstream run')
              if run['event'] == 'create':
                  if run['head_branch'] != branch:
                      skip('not the pilot branch')
                  return None
              if run['event'] != 'pull_request':
                  skip('unsupported event')
              # Run metadata can omit head_branch or PR associations on close.
              # Accept either the exact head branch or a uniquely associated, verified PR.
              associated = run.get('pull_requests') or []
              if len(associated) > 1:
                  skip('ambiguous PR association')
              if associated:
                  number = associated[0]['number']
                  require(valid_number(number), 'Invalid PR number')
                  if run.get('head_branch') != branch:
                      if github('/pulls/' + str(number))['head']['ref'] != branch:
                          skip('not the pilot PR')
                  return number
              if run.get('head_branch') != branch:
                  skip('no pilot PR association')
              return None

          def main():
              require(os.environ.get('GITHUB_REF') == 'refs/heads/main', 'Unexpected ref')
              require(os.environ.get('GITHUB_REPOSITORY') == REPO, 'Unexpected repository')
              require(os.environ.get('GITHUB_RUN_ATTEMPT') == '1', 'Re-runs are not allowed; dispatch instead')
              with open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8') as file:
                  payload = json.load(file)
              require(payload['repository']['id'] == REPO_ID, 'Unexpected event repository')
              task_id = os.environ['CLICKUP_PILOT_TASK_ID']
              require(bool(re.fullmatch(r'[a-z0-9]+', task_id)), 'Missing or invalid pilot configuration')
              branch = 'test/CU-' + task_id
              number = event_pr(payload, branch)
              if number is not None:
                  # A late event about an older, abandoned PR must not enter the queue.
                  query = urllib.parse.urlencode({'head': REPO.split('/')[0] + ':' + branch,
                                                 'base': 'main', 'state': 'all', 'per_page': 100})
                  active = [p['number'] for p in github('/pulls?' + query)
                            if p['state'] == 'open' or p.get('merged_at')]
                  if active != [number]:
                      skip('event is not about the single open or merged pilot PR')
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as file:
                  file.write('eligible=true\n')
              print('Eligible pilot event.')

          try:
              main()
          except urllib.error.HTTPError as error:
              print('API request failed (HTTP ' + str(error.code) + ').')
              sys.exit(1)
          except Exception:
              # Avoid printing response bodies, URLs or event data.
              print('Validation or API failure. Inspect state privately, then dispatch a new run.')
              sys.exit(1)
          PY

  sync:
    needs: check
    if: >-
      needs.check.outputs.eligible == 'true' &&
      github.repository_id == '768432078' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == '1'
    # One queue for every write to the pilot task (automatic runs and dispatches).
    # Only eligible runs get here; a newer one that replaces a pending one recomputes
    # the target from newer GitHub state, so no transition is lost.
    concurrency:
      group: clickup-sync-pilot
      cancel-in-progress: false
    environment: clickup-sync
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Reconcile pilot task
        env:
          CLICKUP_SYNC_TOKEN: ${{ secrets.CLICKUP_SYNC_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          CLICKUP_WORKSPACE_ID: ${{ vars.CLICKUP_WORKSPACE_ID }}
          CLICKUP_LIST_ID: ${{ vars.CLICKUP_LIST_ID }}
          CLICKUP_PILOT_TASK_ID: ${{ vars.CLICKUP_PILOT_TASK_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          REPO = 'elibattistoni/develysverse'
          REPO_ID = 768432078
          OWNER_ID = 14360502
          # Statuses the sync may set, in order. Anything else is manual: never touched.
          ORDER = ['todo', 'in progress', 'code review', 'merged']

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect())

          def request(base, path, token, method='GET', data=None):
              headers = {'Authorization': token, 'Accept': 'application/json'}
              if data is not None:
                  headers['Content-Type'] = 'application/json'
              req = urllib.request.Request(
                  base + path, headers=headers, method=method,
                  data=json.dumps(data).encode() if data is not None else None)
              with opener.open(req, timeout=15) as response:
                  return json.load(response)

          def github(path):
              return request('https://api.github.com', '/repos/' + REPO + path,
                             'Bearer ' + os.environ['GH_TOKEN'])

          def clickup(path, method='GET', data=None):
              return request('https://api.clickup.com/api/v2', path,
                             os.environ['CLICKUP_SYNC_TOKEN'], method, data)

          def skip(reason):
              print('Skipped: ' + reason)
              sys.exit(0)

          def require(condition, reason):
              if not condition:
                  raise RuntimeError(reason)

          def branch_exists(branch):
              try:
                  ref = github('/git/ref/heads/' + urllib.parse.quote(branch, safe='/'))
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      return False
                  raise
              return ref.get('ref') == 'refs/heads/' + branch

          def desired_status(branch):
              """Target status from the current GitHub state (never from the event)."""
              query = urllib.parse.urlencode({'head': REPO.split('/')[0] + ':' + branch,
                                             'base': 'main', 'state': 'all', 'per_page': 100})
              pulls = github('/pulls?' + query)
              # Closed-unmerged PRs are abandoned: they never change the status.
              active = [p for p in pulls if p['state'] == 'open' or p.get('merged_at')]
              if len(active) > 1:
                  skip('pilot branch must have at most one open or merged PR')
              if not active:
                  if pulls:
                      skip('only closed, unmerged PRs')
                  if not branch_exists(branch):
                      skip('pilot branch not found')
                  return 'in progress'
              number = active[0]['number']
              require(type(number) is int and number > 0, 'Invalid PR number')
              pr = github('/pulls/' + str(number))
              if not (pr['number'] == number and pr['head']['ref'] == branch and
                      (pr['head'].get('repo') or {}).get('id') == REPO_ID and
                      pr['base']['ref'] == 'main' and
                      (pr['base'].get('repo') or {}).get('id') == REPO_ID and
                      pr['user']['id'] == OWNER_ID):
                  skip('PR outside the authorized scope')
              if pr['state'] == 'closed':
                  require(pr['merged'] is True, 'Unexpected PR state')
                  if (pr.get('merged_by') or {}).get('id') != OWNER_ID:
                      skip('merge by an unauthorized actor')
                  return 'merged'
              require(pr['state'] == 'open', 'Unexpected PR state')
              return 'in progress' if pr['draft'] else 'code review'

          def main():
              require(os.environ.get('GITHUB_REF') == 'refs/heads/main', 'Unexpected ref')
              require(os.environ.get('GITHUB_REPOSITORY') == REPO, 'Unexpected repository')
              require(os.environ.get('GITHUB_RUN_ATTEMPT') == '1', 'Re-runs are not allowed; dispatch instead')
              workspace = os.environ['CLICKUP_WORKSPACE_ID']
              list_id = os.environ['CLICKUP_LIST_ID']
              task_id = os.environ['CLICKUP_PILOT_TASK_ID']
              require(bool(re.fullmatch(r'[0-9]+', workspace)) and
                      bool(re.fullmatch(r'[0-9]+', list_id)) and
                      bool(re.fullmatch(r'[a-z0-9]+', task_id)), 'Missing or invalid pilot configuration')
              require(bool(os.environ.get('CLICKUP_SYNC_TOKEN')), 'Missing environment token')
              target = desired_status('test/CU-' + task_id)

              teams = clickup('/team')
              require({str(t['id']) for t in teams['teams']} == {workspace}, 'Unexpected workspace access')
              path = '/task/' + task_id
              task = clickup(path)
              require(str(task['id']) == task_id and str(task['team_id']) == workspace and
                      str(task['list']['id']) == list_id, 'Task outside the authorized scope')
              current = task['status']['status'].lower()
              if current not in ORDER:
                  skip('status ' + current.upper() + ' is manual')
              if ORDER.index(current) >= ORDER.index(target):
                  skip('already at ' + current.upper() + ' (target ' + target.upper() + ')')
              # Only status is sent; no automatic final completion or date edits.
              clickup(path, 'PUT', {'status': target})
              updated = clickup(path)
              require(updated['status']['status'].lower() == target, 'Status verification failed')
              require(updated.get('due_date') == task.get('due_date'), 'Due date changed unexpectedly')
              print('Success: ' + current.upper() + ' -> ' + target.upper())

          try:
              main()
          except urllib.error.HTTPError as error:
              print('API request failed (HTTP ' + str(error.code) + ').')
              sys.exit(1)
          except Exception:
              # Avoid printing response bodies, URLs, task data or credentials.
              # (skip() raises SystemExit, which is not an Exception, so it still exits 0.)
              print('Validation or API failure. Inspect state privately, then dispatch a new run.')
              sys.exit(1)
          PY

<?xml version="1.0" encoding="UTF-8"?>
<!-- Social preview (Open Graph) image, 1200×630. Render to PNG with `npm run og`.
     Fonts and images load by relative URL from public/, so open it from that folder. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <style>
    @import url(assets/fonts/fonts-woff2.css);
    .eyebrow { font: 700 15px Inter, sans-serif; letter-spacing: .16em; fill: #76d9d3; }
    .headline { font: 700 60px 'DM Sans', Inter, sans-serif; letter-spacing: -.043em; fill: #f2f5fb; }
    .period { fill: #bdb3ff; }
    .desc { font: 400 21px Inter, sans-serif; fill: #acb9cb; }
    .domain { font: 600 17px Inter, sans-serif; letter-spacing: .04em; fill: #acb9cb; }
    .label { font: 600 13px Inter, sans-serif; fill: #f2f5fb; }
    .frame { fill: none; stroke: rgba(168,161,222,.26); stroke-width: 1.2; }
    .frame-front { fill: none; stroke: #bdb3ff; stroke-width: 1.4; }
  </style>
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#bdb3ff" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#bdb3ff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="fade-up" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0a101c" stop-opacity="0.87" />
      <stop offset="100%" stop-color="#0a101c" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#040710" flood-opacity="0.5" />
    </filter>
    <clipPath id="card"><rect width="340" height="213" rx="14" /></clipPath>
  </defs>

  <rect width="1200" height="630" fill="#090f19" />
  <ellipse cx="900" cy="315" rx="330" ry="290" fill="url(#glow)" />

  <!-- Text column -->
  <text x="96" y="178" class="eyebrow">ELISA BATTISTONI · SOFTWARE ENGINEER</text>
  <text x="92" y="262" class="headline">Building software</text>
  <text x="92" y="328" class="headline">with a scientist&#8217;s</text>
  <text x="92" y="394" class="headline">mindset<tspan class="period">.</tspan></text>
  <text x="96" y="450" class="desc">PhD in Cognitive Neuroscience · Data Science</text>
  <line x1="96" y1="514" x2="126" y2="514" stroke="#bdb3ff" stroke-width="2" />
  <text x="138" y="520" class="domain">develysverse.com</text>

  <!-- Hero fragment stack (same order and tilt as the site's hero) -->
  <g transform="translate(700 100)">
    <!-- upper: Data Science -->
    <g transform="translate(176 106.5) rotate(3.6) scale(.92) translate(-170 -106.5)" filter="url(#shadow)">
      <rect width="340" height="213" rx="14" fill="#162530" />
      <image href="assets/images/hero-data.webp" width="340" height="213" preserveAspectRatio="xMidYMid meet" clip-path="url(#card)" style="filter: brightness(.93) saturate(.84)" />
      <rect width="340" height="213" rx="14" class="frame" />
    </g>
    <!-- lower: Neuroscience -->
    <g transform="translate(176 285) rotate(10) scale(.92) translate(-170 -106.5)" filter="url(#shadow)">
      <rect width="340" height="213" rx="14" fill="#191426" />
      <image href="assets/images/hero-neuroscience.webp" width="340" height="213" preserveAspectRatio="xMidYMid meet" clip-path="url(#card)" />
      <rect width="340" height="213" rx="14" class="frame" />
    </g>
    <!-- front: Software Engineering -->
    <g transform="translate(80 196) rotate(-1.8) translate(-170 -106.5)" filter="url(#shadow)">
      <rect width="340" height="213" rx="14" fill="#131321" />
      <image href="assets/images/hero-software.webp" width="340" height="213" preserveAspectRatio="xMidYMid meet" clip-path="url(#card)" />
      <rect y="163" width="340" height="50" fill="url(#fade-up)" clip-path="url(#card)" />
      <circle cx="180" cy="197" r="3" fill="#76d9d3" />
      <text x="326" y="201" text-anchor="end" class="label">Software Engineering</text>
      <rect width="340" height="213" rx="14" class="frame-front" />
    </g>
  </g>
</svg>
